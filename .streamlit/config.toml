# Analizador Táctico — tema nativo de Streamlit
# ================================================
# Estos valores deben coincidir con BG_COLOR / BG_SECONDARY / TEXT_COLOR de
# app/theme.py — es la misma paleta, duplicada a mano porque Streamlit no
# permite leer este archivo desde Python. Si se cambia acá, cambiar también
# en theme.py (y viceversa).
#
# EXCEPCIÓN DELIBERADA (ver más abajo): primaryColor NO coincide con
# ACCENT_COLOR de theme.py. Está explicado en su lugar; no es un descuido.
#
# base = "dark" es el modo de partida. El switch claro/oscuro propio de
# main.py se monta ENCIMA con CSS (no usa el toggle nativo de Streamlit).

[server]
# Sirve archivos desde app/static/ bajo la URL /app/static/<...> (con soporte
# de range requests, necesario para poder arrastrar la barra del video). Lo
# usa components/video_sync.py para exponerle el video al reproductor
# sincronizado — ver la nota en ese módulo y en .gitignore sobre app/static/.
enableStaticServing = true

# Límite de subida en MB. El default de Streamlit es 200MB, insuficiente
# para un video de partido completo.
maxUploadSize = 2000

[theme]
base = "dark"

# Verde lima táctico (#c3ff00), unificado con ACCENT_COLOR de theme.py:
#   - Pinta lo activo/seleccionado de Streamlit (tabs, sliders, checks, primary buttons)
#   - Se reserva azul (#1f77b4) y rojo (#d62728) solo para los equipos.
primaryColor = "#c3ff00"

backgroundColor = "#0a0b0d"           # fondo principal — carbón casi negro
secondaryBackgroundColor = "#14171a"  # widgets, tarjetas, sidebar
textColor = "#f0f3f6"                 # blanco frío de alta legibilidad
linkColor = "#c3ff00"
borderColor = "#242a35"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize = 15
linkUnderline = false

showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

# Colores de estado — mismos valores que STATUS_COLORS / ZONE_COLORS en theme.py
redColor = "#ef4444"
orangeColor = "#f59e0b"
yellowColor = "#eab308"
greenColor = "#22c55e"
blueColor = "#3b82f6"
violetColor = "#8b5cf6"
grayColor = "#6b7280"

# Paleta categórica para gráficos nativos (st.bar_chart, etc.) — los charts
# Plotly de la app usan sus propios colores explícitos (theme.ZONE_COLORS,
# TEAM_COLORS), esto es solo para consistencia si se agrega un chart nativo.
chartCategoricalColors = ["#3b82f6", "#22c55e", "#ef4444", "#f59e0b", "#8b5cf6", "#eab308", "#6b7280"]

dataframeBorderColor = "#242a35"
dataframeHeaderBackgroundColor = "#14171a"

[theme.sidebar]
backgroundColor = "#0e1115"
secondaryBackgroundColor = "#14171a"
textColor = "#f0f3f6"
borderColor = "#242a35"
primaryColor = "#c3ff00"
